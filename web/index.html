<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>SvxLink-Touch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #081426;
            font-family: Arial, sans-serif;
        }

        /* Welcome screen */

        #welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            touch-action: manipulation;
        }

        #welcome img {
            display: block;
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        /* Main status screen */

        #main {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            color: #ffffff;
            background: #081426;
            grid-template-rows: 76px minmax(0, 1fr) minmax(0, 1fr) 32px;
            gap: 12px;
        }

        /* Header */

        .status-header {
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
        }

        .node-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-logo {
            display: block;
            width: 90px;
            height: 56px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .node-heading h1 {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-header h1 {
            margin: 4px 0 0;
            color: #ffffff;
            font-size: 34px;
        }

        .connection-indicator {
            padding: 10px 16px;
            border-radius: 8px;
            background: #174535;
            color: #8effbf;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Radio and network panels */

        .radio-panel,
        .network-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            min-height: 0;
        }

        .status-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            padding: 16px;
            border: 1px solid #29435f;
            border-radius: 12px;
            background: #172a42;
        }

        .card-label {
            margin-bottom: 10px;
            color: #b8c9df;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-value {
            color: #ffffff;
            font-size: 34px;
            font-weight: bold;
        }

        .network-value {
            color: #ffffff;
            font-size: 27px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        /* Receiver and transmitter indicators */

        .receiver-card.active {
            border-color: #22c55e;
            background: #123d2b;
        }

        .receiver-card.active .card-value {
            color: #4ade80;
        }

        .transmitter-card.active {
            border-color: #ef4444;
            background: #4a2028;
        }

        .transmitter-card.active .card-value {
            color: #ff7777;
        }

        .connection-indicator.offline {
            background: #4a2028;
            color: #ff7777;
        }
        /* Footer */

        .status-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
            color: #a9bed5;
            font-size: 13px;
            text-transform: uppercase;
        }
        /* Node selection overlay */

        .node-overlay[hidden] {
            display: none;
        }

        .node-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.78);
        }

        .node-dialog {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 540px;
            max-height: 100%;
            padding: 20px;
            border: 1px solid #426588;
            border-radius: 14px;
            background: #172a42;
            color: #ffffff;
        }

        .node-dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .node-dialog-header h2 {
            margin: 0;
            font-size: 26px;
        }

        #node-close
        #talkgroup-close {
            min-height: 44px;
            padding: 8px 20px;
            border: 1px solid #426588;
            border-radius: 8px;
            background: #253f60;
            color: #ffffff;
            font-size: 17px;
            cursor: pointer;
        }

        #talkgroup-available-list[hidden] {
            display: none;
        }

        #talkgroup-confirmation[hidden] {
            display: none;
        }

        .talkgroup-confirmation-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .talkgroup-confirmation-actions button {
            flex: 1;
            min-height: 48px;
            padding: 8px;
            border: 1px solid #426588;
            border-radius: 8px;
            background: #253f60;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .node-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            overflow-y: auto;
        }

        .node-list button {
            min-height: 54px;
            padding: 10px 16px;
            border: 1px solid #426588;
            border-radius: 8px;
            background: #253f60;
            color: #ffffff;
            font-size: 20px;
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
        }

        .node-list button.selected {
            border-color: #68baff;
            background: #215b87;
        }
    </style>
</head>

<body>

    <div id="welcome">
        <img src="/assets/branding/svxlink-touch-logo.png"
             alt="SvxLink-Touch">
    </div>

<main id="main">

    <header class="status-header"
            id="node-title-bar"
            role="button"
            tabindex="0"
            aria-label="Select SvxLink node">
        <div class="node-heading">
            <img class="header-logo"
                 src="/assets/branding/svxlink-touch-logo.png"
                 alt="SvxLink-Touch">

            <h1 id="node-callsign">Connecting...</h1>
        </div>

        <div id="connection-indicator" class="connection-indicator">
            LIVE STATUS
        </div>
    </header>

    <section class="radio-panel">

        <div class="status-card receiver-card">
            <div class="card-label">RECEIVER</div>
            <div id="node-rx" class="card-value">—</div>
        </div>

        <div class="status-card transmitter-card">
            <div class="card-label">TRANSMITTER</div>
            <div id="node-tx" class="card-value">—</div>
        </div>

    </section>

    <section class="network-panel">

        <div class="status-card">
            <div class="card-label">REFLECTOR</div>
            <div id="node-reflector" class="network-value">—</div>
        </div>

        <div id="talkgroup-card"
             class="status-card"
             role="button"
             tabindex="0"
             aria-label="Open talkgroup selection">
            <div class="card-label">TALKGROUP</div>
            <div id="node-talkgroup" class="network-value">—</div>
        </div>

    </section>

    <footer class="status-footer">
        <div>
            NODE TYPE:
            <span id="node-type">—</span>
        </div>

        <div>SVXLINK-TOUCH V0.4</div>
    </footer>

</main>

    <!-- Node selection overlay -->
    <div id="node-overlay" class="node-overlay" hidden>
        <section class="node-dialog"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="node-dialog-title">

            <div class="node-dialog-header">
                <h2 id="node-dialog-title">Select Node</h2>
                <button type="button" id="node-close">Close</button>
            </div>

            <div id="node-list" class="node-list">
                <!-- Available nodes inserted by JavaScript -->
            </div>

        </section>
    </div>
    <!-- Talkgroup selection overlay -->
    <div id="talkgroup-overlay" class="node-overlay" hidden>
        <section class="node-dialog"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="talkgroup-dialog-title">

            <div class="node-dialog-header">
                <h2 id="talkgroup-dialog-title">Talkgroups</h2>
                <button type="button" id="talkgroup-close">Close</button>
            </div>

            <div class="node-list">
                <div>
                    NODE:
                    <strong id="talkgroup-selected-node">—</strong>
                </div>

                <div>
                    ACTIVE TALKGROUP:
                    <strong id="talkgroup-current">—</strong>
                </div>

                <div id="talkgroup-available-list">
                    Loading available talkgroups...
                </div>
                <div id="talkgroup-confirmation" hidden>
                    <h3 id="talkgroup-confirmation-name">—</h3>

                    <div>
                        Command:
                        <strong id="talkgroup-confirmation-command">—</strong>
                    </div>

                    <div class="talkgroup-confirmation-actions">
                        <button type="button" id="talkgroup-cancel">
                            Cancel
                        </button>

                        <button type="button" id="talkgroup-confirm">
                            Confirm
                        </button>
                    </div>

                    <div id="talkgroup-confirmation-result"></div>
                </div>
            </div>

        </section>
    </div>
<script>
    // SvxLink-Touch inactivity timeout, in minutes.
    // Set to 0 to disable automatic return to the logo.
    const INACTIVITY_MINUTES = 5;

    const welcome = document.getElementById("welcome");
    const main = document.getElementById("main");

    const nodeTitleBar = document.getElementById("node-title-bar");
    const nodeOverlay = document.getElementById("node-overlay");
    const nodeList = document.getElementById("node-list");
    const nodeClose = document.getElementById("node-close");

    // Selected node is established from the configured node list.
    let selectedNodeId = null;
    let selectedNodeName = "No node selected";

        const LAST_NODE_KEY = "svxlink-touch-last-node";

    async function initialiseNodeSelection() {
        try {
            const response = await fetch("/api/nodes", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Unable to load configured nodes");
            }

            const result = await response.json();
            const nodes = result.nodes || [];

            const local = nodes.find(node => node.local === true);

            if (local) {
                const check = await fetch(
                    "/api/node-status?id=" + encodeURIComponent(local.id),
                    { cache: "no-store" }
                ).catch(() => null);

                if (check && check.ok) {
                    selectedNodeId = local.id;
                    selectedNodeName = local.name;
                    return;
                }
            }

            const previousId = localStorage.getItem(LAST_NODE_KEY);
            const previous = nodes.find(node => node.id === previousId);

            if (previous) {
                selectedNodeId = previous.id;
                selectedNodeName = previous.name;
                return;
            }

            // First installation: prefer a remote node if local is unavailable.
            const fallback = nodes.find(node => node.local !== true);

            if (fallback) {
                selectedNodeId = fallback.id;
                selectedNodeName = fallback.name;
            } else if (nodes.length > 0) {
                selectedNodeId = nodes[0].id;
                selectedNodeName = nodes[0].name;
            }

        } catch (error) {
            console.error("Node selection initialisation failed:", error);
        }
    }

    async function openNodeSelector() {
        nodeOverlay.hidden = false;
        nodeList.replaceChildren();

        const message = document.createElement("div");
        message.textContent = "Loading nodes...";
        nodeList.appendChild(message);

        try {
            const response = await fetch("/api/nodes", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Unable to retrieve configured nodes");
            }

            const result = await response.json();

            nodeList.replaceChildren();

            for (const node of result.nodes || []) {
                const button = document.createElement("button");

                button.type = "button";
                button.textContent = node.name;
                button.dataset.nodeId = node.id;

                if (node.id === selectedNodeId) {
                    button.classList.add("selected");
                }

                // Select the node and immediately refresh its status.
                button.addEventListener("click", function () {
                    selectedNodeId = node.id;
                    selectedNodeName = node.name;

                    localStorage.setItem(LAST_NODE_KEY, selectedNodeId);

                    closeNodeSelector();

                    document.getElementById("node-callsign").textContent =
                        selectedNodeName + " — Connecting...";

                    updateNodeStatus();
                });

                nodeList.appendChild(button);
            }

            if (!nodeList.children.length) {
                message.textContent = "No configured nodes";
                nodeList.appendChild(message);
            }

        } catch (error) {
            nodeList.replaceChildren();
            message.textContent = "Unable to load nodes";
            nodeList.appendChild(message);
        }
    }

    function closeNodeSelector() {
        nodeOverlay.hidden = true;
    }

    nodeTitleBar.addEventListener("click", openNodeSelector);

    nodeTitleBar.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openNodeSelector();
        }
    });

    nodeClose.addEventListener("click", closeNodeSelector);

    const talkgroupCard = document.getElementById("talkgroup-card");
    const talkgroupOverlay = document.getElementById("talkgroup-overlay");
    const talkgroupClose = document.getElementById("talkgroup-close");
    const talkgroupAvailableList = document.getElementById(
        "talkgroup-available-list"
    );
    const talkgroupConfirmation = document.getElementById(
        "talkgroup-confirmation"
    );
    const talkgroupCancel = document.getElementById("talkgroup-cancel");
    const talkgroupConfirm = document.getElementById("talkgroup-confirm");

    let pendingTalkgroup = null;

    function prepareTalkgroupPreview(entry) {
        const number = entry.number ?? entry.tg;

        if (
            !Number.isSafeInteger(number) ||
            number <= 0
        ) {
            return;
        }

        pendingTalkgroup = {
            nodeId: selectedNodeId,
            name: entry.name,
            number: number,
            command: "91" + number + "#"
        };

        document.getElementById(
            "talkgroup-confirmation-name"
        ).textContent = entry.name + " — TG " + number;

        document.getElementById(
            "talkgroup-confirmation-command"
        ).textContent = pendingTalkgroup.command;

        document.getElementById(
            "talkgroup-confirmation-result"
        ).textContent = "Preview only — no DTMF will be transmitted.";

        talkgroupAvailableList.hidden = true;
        talkgroupConfirmation.hidden = false;
    }

    function cancelTalkgroupPreview() {
        pendingTalkgroup = null;
        talkgroupConfirmation.hidden = true;
        talkgroupAvailableList.hidden = false;
    }

    function confirmTalkgroupPreview() {
        if (
            !pendingTalkgroup ||
            pendingTalkgroup.nodeId !== selectedNodeId
        ) {
            cancelTalkgroupPreview();
            return;
        }

        document.getElementById(
            "talkgroup-confirmation-result"
        ).textContent =
            "Preview acknowledged — no DTMF transmitted.";

        talkgroupConfirm.disabled = true;
    }

    talkgroupCancel.addEventListener("click", function () {
        talkgroupConfirm.disabled = false;
        cancelTalkgroupPreview();
    });

    talkgroupConfirm.addEventListener(
        "click",
        confirmTalkgroupPreview
    );
    async function openTalkgroupSelector() {
        const requestedNodeId = selectedNodeId;
        const availableList = document.getElementById(
            "talkgroup-available-list"
        );

        document.getElementById("talkgroup-selected-node").textContent =
            selectedNodeName;

        document.getElementById("talkgroup-current").textContent =
            document.getElementById("node-talkgroup").textContent;

        pendingTalkgroup = null;
        talkgroupConfirmation.hidden = true;
        talkgroupConfirm.disabled = false;
        availableList.hidden = false;

        availableList.replaceChildren();
        availableList.textContent = "Loading available talkgroups...";

        talkgroupOverlay.hidden = false;

        try {
            const response = await fetch(
                "/api/talkgroups?id=" + encodeURIComponent(requestedNodeId),
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error("Unable to retrieve talkgroups");
            }

            const result = await response.json();

            if (
                talkgroupOverlay.hidden ||
                selectedNodeId !== requestedNodeId
            ) {
                return;
            }

            availableList.replaceChildren();

            if (!result.available) {
                availableList.textContent =
                    result.error || "Talkgroup discovery unavailable";
                return;
            }

            const favourites = result.favorites || [];
            const monitored = result.talkgroups || [];

            if (favourites.length === 0 && monitored.length === 0) {
                availableList.textContent =
                    "No favourite or monitored talkgroups configured.";
                return;
            }

            function appendTalkgroupSection(title, entries) {
                if (entries.length === 0) {
                    return;
                }

                const heading = document.createElement("h3");
                heading.textContent = title;
                availableList.appendChild(heading);

                for (const entry of entries) {
                    const item = document.createElement("button");

                    const number = entry.number ?? entry.tg;

                    item.type = "button";
                    item.textContent =
                        entry.name + " — TG " + number;

                    item.addEventListener("click", function () {
                        prepareTalkgroupPreview(entry);
                    });

                    availableList.appendChild(item);
                }
            }

            appendTalkgroupSection("Favourites", favourites);
            appendTalkgroupSection("Monitored Talkgroups", monitored);

        } catch (error) {
            if (
                !talkgroupOverlay.hidden &&
                selectedNodeId === requestedNodeId
            ) {
                availableList.textContent =
                    "Unable to load talkgroups";
            }
        }
    }

    function closeTalkgroupSelector() {
        pendingTalkgroup = null;
        talkgroupConfirmation.hidden = true;
        talkgroupAvailableList.hidden = false;
        talkgroupConfirm.disabled = false;
        talkgroupOverlay.hidden = true;
    }

    talkgroupCard.addEventListener("click", openTalkgroupSelector);

    talkgroupCard.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openTalkgroupSelector();
        }
    });

    talkgroupClose.addEventListener("click", closeTalkgroupSelector);

    let inactivityTimer = null;
    let currentPage = "welcome";

    function showWelcome() {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;

        main.style.display = "none";
        welcome.style.display = "flex";
        currentPage = "welcome";
    }

// Remote node status — initial V0.4 implementation.
    let statusRequestId = 0;

    async function updateNodeStatus() {
        const requestId = ++statusRequestId;
        const nodeId = selectedNodeId;

        if (nodeId === null) {
            return;
        }

        try {
            const response = await fetch(
                "/api/node-status?id=" + encodeURIComponent(nodeId),
                { cache: "no-store" }
            );

            if (requestId !== statusRequestId) {
                return;
            }

            if (!response.ok) {
                throw new Error("Remote node unavailable");
            }

            const result = await response.json();

            if (requestId !== statusRequestId) {
                return;
            }

            if (!result.connected || !result.data?.status) {
                throw new Error("Invalid remote node response");
            }

            const status = result.data.status;
            const radio = status.radio_state || {};

            document.getElementById("node-callsign").textContent =
                status.callsign || "Unknown";

            document.getElementById("node-type").textContent =
                status.node_type || "Unknown";

            document.getElementById("node-rx").textContent =
                radio.rx ? "Active" : "Idle";

            document.getElementById("node-tx").textContent =
                radio.tx ? "Active" : "Idle";
            // Update receiver and transmitter activity indicators.
            document.querySelector(".receiver-card")
                .classList.toggle("active", radio.rx === true);

            document.querySelector(".transmitter-card")
                .classList.toggle("active", radio.tx === true);
            document.getElementById("node-reflector").textContent =
                status.reflector || "Unknown";
            // Reflect the actual remote API connection state.
            const indicator = document.getElementById("connection-indicator");
            indicator.textContent = "LIVE STATUS";
            indicator.classList.remove("offline");
            document.getElementById("node-talkgroup").textContent =
                status.active_talkgroup || "Standby";

        } catch (error) {
            // Ignore errors from superseded status requests.
            if (requestId !== statusRequestId) {
                return;
            }

            // Clear stale activity indicators if the node becomes unreachable.
            document.querySelector(".receiver-card")
                .classList.remove("active");

            document.querySelector(".transmitter-card")
                .classList.remove("active");

            // Indicate loss of remote API connectivity.
            const indicator = document.getElementById("connection-indicator");
            indicator.textContent = "OFFLINE";
            indicator.classList.add("offline");

            // Reset displayed node information.
            document.getElementById("node-callsign").textContent =
                selectedNodeName + " — Offline";

            document.getElementById("node-type").textContent = "—";
            document.getElementById("node-rx").textContent = "—";
            document.getElementById("node-tx").textContent = "—";
            document.getElementById("node-reflector").textContent = "Unavailable";
            document.getElementById("node-talkgroup").textContent = "—";
        }
    }

    // Poll the remote node every five seconds.
    setInterval(updateNodeStatus, 5000);

    async function showMain() {
        welcome.style.display = "none";
        main.style.display = "grid";
        currentPage = "main";

        if (selectedNodeId === null) {
            await initialiseNodeSelection();
        }

        if (selectedNodeId !== null) {
            updateNodeStatus();
        }

        resetInactivityTimer();
    }

    function resetInactivityTimer() {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;

        if (currentPage !== "main" || INACTIVITY_MINUTES <= 0) {
            return;
        }

        inactivityTimer = setTimeout(
            showWelcome,
            INACTIVITY_MINUTES * 60 * 1000
        );
    }

    // Touch the logo to enter SvxLink-Touch.
    welcome.addEventListener("click", showMain);

    // Reset timeout whenever the application is used.
    ["pointerdown", "keydown", "wheel"].forEach(function (eventName) {
        document.addEventListener(eventName, function () {
            if (currentPage === "main") {
                resetInactivityTimer();
            }
        });
    });
</script>

</body>
</html>
