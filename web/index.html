<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>SvxLink-Touch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #081426;
            font-family: Arial, sans-serif;
        }

        #welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            touch-action: manipulation;
        }

        #welcome img {
            display: block;
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        #main {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            color: white;
        }

        #main h1 {
            margin: 0;
            color: #68baff;
        }
    </style>
</head>

<body>

    <div id="welcome">
        <img src="/assets/branding/svxlink-touch-logo.png"
             alt="SvxLink-Touch">
    </div>

    <main id="main">
        <h1>SvxLink-Touch</h1>
        <p>Node status interface — under development</p>
    </main>

<script>
    // SvxLink-Touch inactivity timeout, in minutes.
    // Set to 0 to disable automatic return to the logo.
    const INACTIVITY_MINUTES = 5;

    const welcome = document.getElementById("welcome");
    const main = document.getElementById("main");

    let inactivityTimer = null;
    let currentPage = "welcome";

    function showWelcome() {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;

        main.style.display = "none";
        welcome.style.display = "flex";
        currentPage = "welcome";
    }

    function showMain() {
        welcome.style.display = "none";
        main.style.display = "block";
        currentPage = "main";

        resetInactivityTimer();
    }

    function resetInactivityTimer() {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;

        if (currentPage !== "main" || INACTIVITY_MINUTES <= 0) {
            return;
        }

        inactivityTimer = setTimeout(
            showWelcome,
            INACTIVITY_MINUTES * 60 * 1000
        );
    }

    // Touch the logo to enter SvxLink-Touch.
    welcome.addEventListener("click", showMain);

    // Reset timeout whenever the application is used.
    ["pointerdown", "keydown", "wheel"].forEach(function (eventName) {
        document.addEventListener(eventName, function () {
            if (currentPage === "main") {
                resetInactivityTimer();
            }
        });
    });
</script>

</body>
</html>
